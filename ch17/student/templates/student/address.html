<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <!-- {{form}} -->

        {% for field in form %} 
        <!-- {{field.label}} -->
         <label for="{{field.id_for_label}}" class="cssclass">{{field.label}}</label>
        <input type="{{field.field.widget.input_type}}" name="{{field.name}}" required id="{{field.id_for_label}}" value="{{field.value|default:''}}" placeholder="{{field.field.widget.attrs.placeholder|default:''}}" required="{{field.field.required}}">
        <br>
        {% endfor %}



    </form>
</body>
</html>
